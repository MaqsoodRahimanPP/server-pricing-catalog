services:
  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /app/data/cloudblueprint.db
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in your environment}
    volumes:
      - cloudblueprint_data:/app/data
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - cloudblueprint_internal

  frontend:
    build:
      context: .
    ports:
      - "18086:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cloudblueprint_internal

volumes:
  cloudblueprint_data:

networks:
  cloudblueprint_internal:
    driver: bridge
